name: himekuri

on:
  schedule:
    # GitHub の予約実行は遅れたり飛ばされたりする（0:07 と 1:07 が丸ごと来なかった日がある）。
    # 毎時 7 分に走らせ、日付が変わっていれば描き替える（同じ日なら何も書き換えない）
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tear-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run himekuri
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A himekuri README.md
          git diff --cached --quiet || git commit -m "himekuri: $(TZ=Asia/Tokyo date +%F)"
          git push
