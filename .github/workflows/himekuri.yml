name: himekuri

on:
  schedule:
    # 0 分ちょうどは混雑で飛ばされやすいので 7 分にずらし、予備も 2 回（日付が同じなら何も書き換えない）
    - cron: "7 15 * * *"   # 0:07 JST
    - cron: "7 16 * * *"   # 1:07 JST
    - cron: "7 18 * * *"   # 3:07 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tear-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run himekuri
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A himekuri README.md
          git diff --cached --quiet || git commit -m "himekuri: $(TZ=Asia/Tokyo date +%F)"
          git push
