			<g transform="translate(35,60) scale(0.3)"><svg viewBox="0 0 100 70"><g dominant-baseline="middle"><text font-size="8" fill="red" x="12.5" y="12">日</text><text font-size="8" fill="black" x="25" y="12">月</text><text font-size="8" fill="black" x="37.5" y="12">火</text><text font-size="8" fill="black" x="50" y="12">水</text><text font-size="8" fill="black" x="62.5" y="12">木</text><text font-size="8" fill="black" x="75" y="12">金</text><text font-size="8" fill="blue" x="87.5" y="12">土</text><text font-size="8" x="12.5" y="22" fill="red">1</text><circle cx="25" cy="21.5" r="5" fill="#fee" stroke="#f40" stroke-width="0.5"/><rect x="20" y="16.5" width="10" height="10" fill="#ccc" stroke="#444" stroke-width="0.5"/><text font-size="8" x="25" y="22" fill="black">2</text><text font-size="8" x="37.5" y="22" fill="red" data-tip="11月3日&#10;文化の日">3</text><text font-size="8" x="50" y="22" fill="black">4</text><text font-size="8" x="62.5" y="22" fill="black">5</text><text font-size="8" x="75" y="22" fill="black">6</text><text font-size="8" x="87.5" y="22" fill="blue">7</text><text font-size="8" x="12.5" y="32" fill="red">8</text><text font-size="8" x="25" y="32" fill="black">9</text><text font-size="8" x="37.5" y="32" fill="black">10</text><text font-size="8" x="50" y="32" fill="black">11</text><text font-size="8" x="62.5" y="32" fill="black">12</text><text font-size="8" x="75" y="32" fill="black">13</text><text font-size="8" x="87.5" y="32" fill="blue">14</text><text font-size="8" x="12.5" y="42" fill="red">15</text><text font-size="8" x="25" y="42" fill="black">16</text><text font-size="8" x="37.5" y="42" fill="black">17</text><text font-size="8" x="50" y="42" fill="black">18</text><text font-size="8" x="62.5" y="42" fill="black">19</text><text font-size="8" x="75" y="42" fill="black">20</text><text font-size="8" x="87.5" y="42" fill="blue">21</text><text font-size="8" x="12.5" y="52" fill="red">22</text><text font-size="8" x="25" y="52" fill="red" data-tip="11月23日&#10;勤労感謝の日">23</text><text font-size="8" x="37.5" y="52" fill="black">24</text><text font-size="8" x="50" y="52" fill="black">25</text><text font-size="8" x="62.5" y="52" fill="black">26</text><text font-size="8" x="75" y="52" fill="black">27</text><text font-size="8" x="87.5" y="52" fill="blue">28</text><text font-size="8" x="12.5" y="62" fill="red">29</text><text font-size="8" x="25" y="62" fill="black">30</text></g></svg></g>
			<text font-size="4" transform="translate(7,40)"><tspan x="0 0" y="0 4">旧暦</tspan></text>
			<text font-size="4" transform="translate(7,50)"><tspan x="0 0 0 0 0 0 0" dy="1 5 5 5 5">九月廿三日</tspan></text>
			<text font-size="4" transform="translate(13,40)" data-tip="先勝&#10;「先んずれば即ち勝つ」万事に急ぐことが良いとされる。午前中は吉、午後二時より六時までは凶。"><tspan x="0 0" dy="0 4">先勝</tspan></text>
			<text font-size="4" transform="translate(13,50)"><tspan x="0 0" dy="0 4">庚辰</tspan></text>
			<text font-size="4" transform="translate(13,60)"><tspan x="0 0 0 0" dy="0 4 4 4" data-tip="八白土星&#10;【変化・蓄積】山のように、物事の停止と再出発（変化）を表す星。転職や引越し、方針転換など、状況を改善するための変化を起こすのに良い日です。">八白土星</tspan></text>
			<text font-size="2.4" transform="translate(18,45)"><tspan x="0 0 0 0 0 0 0 0" dy="0 2.5 2.5 2.5 2.5 2.5 2.5 2.5">かのえ・たつ</tspan></text>
			<text font-size="2.2" transform="translate(8,80)">十二直</text>
			<text font-size="2.2" transform="translate(18,80)">二十八宿</text>
			<text font-size="2.2" transform="translate(28,80)">二十七宿</text>
			<text font-size="5" font-weight="700" transform="translate(8,86)" data-tip="十二直 破（やぶる）&#10;物事を突破する日&#10;訴訟・出陣・漁猟・服薬は吉。祝い事・契約事は凶">破</text>
			<text font-size="5" font-weight="700" transform="translate(18,86)" data-tip="二十八宿 畢（ひつ）&#10;おうし座ε(あめふり星)の宿に入る。&#10;祭祀・取引開始・普請開始・土地開拓・縁談に吉">畢</text>
			<text font-size="5" font-weight="700" transform="translate(28,86)" data-tip="二十七宿 張（ちょう）&#10;うみへび座υ1(ちりこ星)の宿に入る。&#10;就職・見合い・神仏祈願・祝い事に吉">張</text>
			<text font-size="2.2" transform="translate(8,90)">やぶる</text>
			<text font-size="2.2" transform="translate(18,90)">ひつ</text>
			<text font-size="2.2" transform="translate(28,90)">ちょう</text>
			<text font-size="3" transform="translate(82,78)">
				<tspan data-tip="霜降&#10;つゆが陰気に結ばれて霜となりて降るゆへ也&#10;北国や山間部では、霜が降りて朝には草木が白く化粧をする頃です。野の花の数は減り始めますが、かわって山を紅葉が飾る頃です。">霜降</tspan>11日目
				<tspan data-tip="七十二候 楓蔦黄（ふうかつきなり）&#10;モミジやツタの紅葉が始まる">[ 楓蔦黄 ]</tspan></text>
			<text font-size="3" transform="translate(82,83)"><tspan data-tip="立冬&#10;冬の気立ち初めていよいよ冷ゆれば也&#10;この日から立春の前日までが冬。日は短くなり時雨が降る季節。北国や高山からは初雪の知らせも届き、関東では空っ風が吹く頃です。">立冬</tspan>まであと5日</text>
			<text font-size="3" transform="translate(82,88)">(太陽黄経 219.70°・正午)</text>
			<text font-size="3.2" font-weight="700" transform="translate(50,95)">
				<tspan data-tip="土用&#10;五行に由来する暦の雑節で、四立（立夏・立秋・立冬・立春）の直前約18日間である。五行では、春に木、夏に火、秋に金、冬に水を割り当てている。残った土は季節の変わり目に割り当てられ、これを「土旺用事」=&gt;「土用」と呼んだ。">土用</tspan> <tspan data-tip="小犯土&#10;土を犯してはならない。穴掘り・井戸掘り・種まき・土木工事・伐採など土いじりは一切慎むべき。特に、地鎮祭等の建築儀礼は凶。">小犯土</tspan> <tspan data-tip="庚辰&#10;十干の庚は陽の金、十二支の辰は陽の土で、相生（土生金）である。">庚辰</tspan>
			</text>        </g>
	</svg>
