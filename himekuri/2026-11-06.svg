	</svg></g>
			<g transform="translate(35,60) scale(0.3)"><svg viewBox="0 0 100 70"><g dominant-baseline="middle"><text font-size="8" fill="red" x="12.5" y="12">日</text><text font-size="8" fill="black" x="25" y="12">月</text><text font-size="8" fill="black" x="37.5" y="12">火</text><text font-size="8" fill="black" x="50" y="12">水</text><text font-size="8" fill="black" x="62.5" y="12">木</text><text font-size="8" fill="black" x="75" y="12">金</text><text font-size="8" fill="blue" x="87.5" y="12">土</text><text font-size="8" x="12.5" y="22" fill="red">1</text><text font-size="8" x="25" y="22" fill="black">2</text><text font-size="8" x="37.5" y="22" fill="red" data-tip="11月3日&#10;文化の日">3</text><text font-size="8" x="50" y="22" fill="black">4</text><text font-size="8" x="62.5" y="22" fill="black">5</text><circle cx="75" cy="21.5" r="5" fill="#fee" stroke="#f40" stroke-width="0.5"/><rect x="70" y="16.5" width="10" height="10" fill="#ccc" stroke="#444" stroke-width="0.5"/><text font-size="8" x="75" y="22" fill="black">6</text><text font-size="8" x="87.5" y="22" fill="blue">7</text><text font-size="8" x="12.5" y="32" fill="red">8</text><text font-size="8" x="25" y="32" fill="black">9</text><text font-size="8" x="37.5" y="32" fill="black">10</text><text font-size="8" x="50" y="32" fill="black">11</text><text font-size="8" x="62.5" y="32" fill="black">12</text><text font-size="8" x="75" y="32" fill="black">13</text><text font-size="8" x="87.5" y="32" fill="blue">14</text><text font-size="8" x="12.5" y="42" fill="red">15</text><text font-size="8" x="25" y="42" fill="black">16</text><text font-size="8" x="37.5" y="42" fill="black">17</text><text font-size="8" x="50" y="42" fill="black">18</text><text font-size="8" x="62.5" y="42" fill="black">19</text><text font-size="8" x="75" y="42" fill="black">20</text><text font-size="8" x="87.5" y="42" fill="blue">21</text><text font-size="8" x="12.5" y="52" fill="red">22</text><text font-size="8" x="25" y="52" fill="red" data-tip="11月23日&#10;勤労感謝の日">23</text><text font-size="8" x="37.5" y="52" fill="black">24</text><text font-size="8" x="50" y="52" fill="black">25</text><text font-size="8" x="62.5" y="52" fill="black">26</text><text font-size="8" x="75" y="52" fill="black">27</text><text font-size="8" x="87.5" y="52" fill="blue">28</text><text font-size="8" x="12.5" y="62" fill="red">29</text><text font-size="8" x="25" y="62" fill="black">30</text></g></svg></g>
			<text font-size="4" transform="translate(7,40)"><tspan x="0 0" y="0 4">旧暦</tspan></text>
			<text font-size="4" transform="translate(7,50)"><tspan x="0 0 0 0 0 0 0" dy="1 5 5 5 5">九月廿七日</tspan></text>
			<text font-size="4" transform="translate(13,40)" data-tip="大安&#10;「大いに安し」の意味。六曜の中で最も吉の日とされる。何事においても吉。婚礼はこの日に行われることが多い。"><tspan x="0 0" dy="0 4">大安</tspan></text>
			<text font-size="4" transform="translate(13,50)"><tspan x="0 0" dy="0 4">甲申</tspan></text>
			<text font-size="4" transform="translate(13,60)"><tspan x="0 0 0 0" dy="0 4 4 4" data-tip="四緑木星&#10;【調和・信用】風のように隅々まで行き渡る、調和と信用を表す星。人との縁が結ばれやすく、商談や交際、遠方への旅行などに大吉の日です。">四緑木星</tspan></text>
			<text font-size="2.4" transform="translate(18,45)"><tspan x="0 0 0 0 0 0 0 0" dy="0 2.5 2.5 2.5 2.5 2.5 2.5 2.5">きのえ・さる</tspan></text>
			<text font-size="2.2" transform="translate(8,80)">十二直</text>
			<text font-size="2.2" transform="translate(18,80)">二十八宿</text>
			<text font-size="2.2" transform="translate(28,80)">二十七宿</text>
			<text font-size="5" font-weight="700" transform="translate(8,86)" data-tip="十二直 開（ひらく）&#10;開き通じる日&#10;建築・移転・結婚等は吉。葬式は凶">開</text>
			<text font-size="5" font-weight="700" transform="translate(18,86)" data-tip="二十八宿 鬼（き）&#10;かに座θ(たまおの星)の宿に入る。&#10;婚礼のみ凶。他の事には全て吉">鬼</text>
			<text font-size="5" font-weight="700" transform="translate(28,86)" data-tip="二十七宿 亢（こう）&#10;おとめ座κ(あみ星)の宿に入る。&#10;衣類仕立て・物品購入・種まきに吉。造作に凶">亢</text>
			<text font-size="2.2" transform="translate(8,90)">ひらく</text>
			<text font-size="2.2" transform="translate(18,90)">き</text>
			<text font-size="2.2" transform="translate(28,90)">こう</text>
			<text font-size="3" transform="translate(82,78)">
				<tspan data-tip="霜降&#10;つゆが陰気に結ばれて霜となりて降るゆへ也&#10;北国や山間部では、霜が降りて朝には草木が白く化粧をする頃です。野の花の数は減り始めますが、かわって山を紅葉が飾る頃です。">霜降</tspan>15日目
				<tspan data-tip="七十二候 楓蔦黄（ふうかつきなり）&#10;モミジやツタの紅葉が始まる">[ 楓蔦黄 ]</tspan></text>
			<text font-size="3" transform="translate(82,83)"><tspan data-tip="立冬&#10;冬の気立ち初めていよいよ冷ゆれば也&#10;この日から立春の前日までが冬。日は短くなり時雨が降る季節。北国や高山からは初雪の知らせも届き、関東では空っ風が吹く頃です。">立冬</tspan>まであと1日</text>
			<text font-size="3" transform="translate(82,88)">(太陽黄経 223.71°・正午)</text>
			<text font-size="3.2" font-weight="700" transform="translate(50,95)">
				<tspan data-tip="土用&#10;五行に由来する暦の雑節で、四立（立夏・立秋・立冬・立春）の直前約18日間である。五行では、春に木、夏に火、秋に金、冬に水を割り当てている。残った土は季節の変わり目に割り当てられ、これを「土旺用事」=&gt;「土用」と呼んだ。">土用</tspan> <tspan data-tip="十方暮&#10;天地の気が相剋して、万事うまく行かない凶日とされている。労多くして功の少ない日。">十方暮</tspan> <tspan data-tip="小犯土&#10;土を犯してはならない。穴掘り・井戸掘り・種まき・土木工事・伐採など土いじりは一切慎むべき。特に、地鎮祭等の建築儀礼は凶。">小犯土</tspan>
			</text>        </g>
	</svg>
