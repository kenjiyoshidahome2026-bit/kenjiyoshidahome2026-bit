	</svg></g>
			<g transform="translate(35,60) scale(0.3)"><svg viewBox="0 0 100 70"><g dominant-baseline="middle"><text font-size="8" fill="red" x="12.5" y="12">日</text><text font-size="8" fill="black" x="25" y="12">月</text><text font-size="8" fill="black" x="37.5" y="12">火</text><text font-size="8" fill="black" x="50" y="12">水</text><text font-size="8" fill="black" x="62.5" y="12">木</text><text font-size="8" fill="black" x="75" y="12">金</text><text font-size="8" fill="blue" x="87.5" y="12">土</text><text font-size="8" x="12.5" y="22" fill="red">1</text><text font-size="8" x="25" y="22" fill="black">2</text><text font-size="8" x="37.5" y="22" fill="red" data-tip="11月3日&#10;文化の日">3</text><text font-size="8" x="50" y="22" fill="black">4</text><text font-size="8" x="62.5" y="22" fill="black">5</text><text font-size="8" x="75" y="22" fill="black">6</text><text font-size="8" x="87.5" y="22" fill="blue">7</text><text font-size="8" x="12.5" y="32" fill="red">8</text><text font-size="8" x="25" y="32" fill="black">9</text><text font-size="8" x="37.5" y="32" fill="black">10</text><text font-size="8" x="50" y="32" fill="black">11</text><text font-size="8" x="62.5" y="32" fill="black">12</text><circle cx="75" cy="31.5" r="5" fill="#fee" stroke="#f40" stroke-width="0.5"/><rect x="70" y="26.5" width="10" height="10" fill="#ccc" stroke="#444" stroke-width="0.5"/><text font-size="8" x="75" y="32" fill="black">13</text><text font-size="8" x="87.5" y="32" fill="blue">14</text><text font-size="8" x="12.5" y="42" fill="red">15</text><text font-size="8" x="25" y="42" fill="black">16</text><text font-size="8" x="37.5" y="42" fill="black">17</text><text font-size="8" x="50" y="42" fill="black">18</text><text font-size="8" x="62.5" y="42" fill="black">19</text><text font-size="8" x="75" y="42" fill="black">20</text><text font-size="8" x="87.5" y="42" fill="blue">21</text><text font-size="8" x="12.5" y="52" fill="red">22</text><text font-size="8" x="25" y="52" fill="red" data-tip="11月23日&#10;勤労感謝の日">23</text><text font-size="8" x="37.5" y="52" fill="black">24</text><text font-size="8" x="50" y="52" fill="black">25</text><text font-size="8" x="62.5" y="52" fill="black">26</text><text font-size="8" x="75" y="52" fill="black">27</text><text font-size="8" x="87.5" y="52" fill="blue">28</text><text font-size="8" x="12.5" y="62" fill="red">29</text><text font-size="8" x="25" y="62" fill="black">30</text></g></svg></g>
			<text font-size="4" transform="translate(7,40)"><tspan x="0 0" y="0 4">旧暦</tspan></text>
			<text font-size="4" transform="translate(7,50)"><tspan x="0 0 0 0 0 0 0" dy="1 6 8 6">十月五日</tspan></text>
			<text font-size="4" transform="translate(13,40)" data-tip="友引&#10;「凶事に友を引く」朝は吉、昼は凶、夕は大吉とされる。友が冥土に引き寄せると言われ、葬式は凶。"><tspan x="0 0" dy="0 4">友引</tspan></text>
			<text font-size="4" transform="translate(13,50)"><tspan x="0 0" dy="0 4">辛卯</tspan></text>
			<text font-size="4" transform="translate(13,60)"><tspan x="0 0 0 0" dy="0 4 4 4" data-tip="六白金星&#10;【天・活動】天や太陽のように、活動的で完璧を求める星。目上の人からの引き立てや、大きな目標に向かって突き進むのに最適な日です。">六白金星</tspan></text>
			<text font-size="2.4" transform="translate(18,45)"><tspan x="0 0 0 0 0 0 0 0" dy="0 2.5 2.5 2.5 2.5 2.5 2.5 2.5">かのと・う</tspan></text>
			<text font-size="2.2" transform="translate(8,80)">十二直</text>
			<text font-size="2.2" transform="translate(18,80)">二十八宿</text>
			<text font-size="2.2" transform="translate(28,80)">二十七宿</text>
			<text font-size="5" font-weight="700" transform="translate(8,86)" data-tip="十二直 定（さだん）&#10;善悪が定まる日&#10;開店・結婚・移転・種まきは吉。旅行・訴訟は凶">定</text>
			<text font-size="5" font-weight="700" transform="translate(18,86)" data-tip="二十八宿 亢（こう）&#10;おとめ座κ(あみ星)の宿に入る。&#10;衣類仕立て・物品購入・種まきに吉。造作に凶">亢</text>
			<text font-size="5" font-weight="700" transform="translate(28,86)" data-tip="二十七宿 女（じょ）&#10;みずがめ座ε(うるき星)の宿に入る。&#10;稽古始め・お披露目に吉。訴訟・結婚・葬式に凶">女</text>
			<text font-size="2.2" transform="translate(8,90)">さだん</text>
			<text font-size="2.2" transform="translate(18,90)">こう</text>
			<text font-size="2.2" transform="translate(28,90)">じょ</text>
			<text font-size="3" transform="translate(82,78)">
				<tspan data-tip="立冬&#10;冬の気立ち初めていよいよ冷ゆれば也&#10;この日から立春の前日までが冬。日は短くなり時雨が降る季節。北国や高山からは初雪の知らせも届き、関東では空っ風が吹く頃です。">立冬</tspan>7日目
				<tspan data-tip="七十二候 地始凍（ちはじめてこおる）&#10;大地が凍り始める">[ 地始凍 ]</tspan></text>
			<text font-size="3" transform="translate(82,83)"><tspan data-tip="小雪&#10;冷ゆるが故に雨も雪となりてくだるがゆへ也&#10;陽射しは弱まり、冷え込みが厳しくなる季節。木々の葉は落ち、平地にも初雪が舞い始める頃です。">小雪</tspan>まであと9日</text>
			<text font-size="3" transform="translate(82,88)">(太陽黄経 230.74°・正午)</text>
			<text font-size="3.2" font-weight="700" transform="translate(50,95)">
				<tspan data-tip="十方暮&#10;天地の気が相剋して、万事うまく行かない凶日とされている。労多くして功の少ない日。">十方暮</tspan>
