			<text font-size="5" font-weight="700" transform="translate(18,86)" data-tip="二十八宿 柳（りゅう）&#10;うみへび座δ(ぬりこ星)の宿に入る。&#10;物事を断るのに吉。結婚・開店・葬式に凶">柳</text>
			<text font-size="5" font-weight="700" transform="translate(28,86)" data-tip="二十七宿 氐（てい）&#10;てんびん座α(とも星)の宿に入る。&#10;結婚・開店・結納・酒造りに吉。着始めに凶">氐</text>
