				<tspan data-tip="七十二候 山茶始開（つばきはじめてひらく）&#10;サザンカの花が咲き始める">[ 山茶始開 ]</tspan></text>
			<text font-size="3" transform="translate(82,83)"><tspan data-tip="小雪&#10;冷ゆるが故に雨も雪となりてくだるがゆへ也&#10;陽射しは弱まり、冷え込みが厳しくなる季節。木々の葉は落ち、平地にも初雪が舞い始める頃です。">小雪</tspan>まであと15日</text>
			<text font-size="3" transform="translate(82,88)">(太陽黄経 224.71°・正午)</text>
			<text font-size="3.2" font-weight="700" transform="translate(50,95)">
				<tspan data-tip="十死日&#10;暦には「十し」と書かれる。受死日(黒日)の次に凶日とされ、全てのことに凶とされる。ただし、受死日と違い葬式も差し支えありとしている。">十死日</tspan> <tspan data-tip="十方暮&#10;天地の気が相剋して、万事うまく行かない凶日とされている。労多くして功の少ない日。">十方暮</tspan> <tspan data-tip="一粒万倍日&#10;一粒の籾が万倍にも実る稲穂になるという意味である。何事を始めるにも良い日とされ、仕事始め、開店、種まき、お金を出すことに吉。但し、借金は苦労の種を蒔くので凶。">一粒万倍日</tspan>
