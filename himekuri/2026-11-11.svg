			<g transform="translate(35,60) scale(0.3)"><svg viewBox="0 0 100 70"><g dominant-baseline="middle"><text font-size="8" fill="red" x="12.5" y="12">日</text><text font-size="8" fill="black" x="25" y="12">月</text><text font-size="8" fill="black" x="37.5" y="12">火</text><text font-size="8" fill="black" x="50" y="12">水</text><text font-size="8" fill="black" x="62.5" y="12">木</text><text font-size="8" fill="black" x="75" y="12">金</text><text font-size="8" fill="blue" x="87.5" y="12">土</text><text font-size="8" x="12.5" y="22" fill="red">1</text><text font-size="8" x="25" y="22" fill="black">2</text><text font-size="8" x="37.5" y="22" fill="red" data-tip="11月3日&#10;文化の日">3</text><text font-size="8" x="50" y="22" fill="black">4</text><text font-size="8" x="62.5" y="22" fill="black">5</text><text font-size="8" x="75" y="22" fill="black">6</text><text font-size="8" x="87.5" y="22" fill="blue">7</text><text font-size="8" x="12.5" y="32" fill="red">8</text><text font-size="8" x="25" y="32" fill="black">9</text><text font-size="8" x="37.5" y="32" fill="black">10</text><circle cx="50" cy="31.5" r="5" fill="#fee" stroke="#f40" stroke-width="0.5"/><rect x="45" y="26.5" width="10" height="10" fill="#ccc" stroke="#444" stroke-width="0.5"/><text font-size="8" x="50" y="32" fill="black">11</text><text font-size="8" x="62.5" y="32" fill="black">12</text><text font-size="8" x="75" y="32" fill="black">13</text><text font-size="8" x="87.5" y="32" fill="blue">14</text><text font-size="8" x="12.5" y="42" fill="red">15</text><text font-size="8" x="25" y="42" fill="black">16</text><text font-size="8" x="37.5" y="42" fill="black">17</text><text font-size="8" x="50" y="42" fill="black">18</text><text font-size="8" x="62.5" y="42" fill="black">19</text><text font-size="8" x="75" y="42" fill="black">20</text><text font-size="8" x="87.5" y="42" fill="blue">21</text><text font-size="8" x="12.5" y="52" fill="red">22</text><text font-size="8" x="25" y="52" fill="red" data-tip="11月23日&#10;勤労感謝の日">23</text><text font-size="8" x="37.5" y="52" fill="black">24</text><text font-size="8" x="50" y="52" fill="black">25</text><text font-size="8" x="62.5" y="52" fill="black">26</text><text font-size="8" x="75" y="52" fill="black">27</text><text font-size="8" x="87.5" y="52" fill="blue">28</text><text font-size="8" x="12.5" y="62" fill="red">29</text><text font-size="8" x="25" y="62" fill="black">30</text></g></svg></g>
			<text font-size="4" transform="translate(7,40)"><tspan x="0 0" y="0 4">旧暦</tspan></text>
			<text font-size="4" transform="translate(7,50)"><tspan x="0 0 0 0 0 0 0" dy="1 6 8 6">十月三日</tspan></text>
			<text font-size="4" transform="translate(13,40)" data-tip="赤口&#10;午の刻(お昼)と法事のみ吉で、それ以外は凶とされる。火の元、刃物に気をつける。"><tspan x="0 0" dy="0 4">赤口</tspan></text>
			<text font-size="4" transform="translate(13,50)"><tspan x="0 0" dy="0 4">己丑</tspan></text>
			<text font-size="4" transform="translate(13,60)"><tspan x="0 0 0 0" dy="0 4 4 4" data-tip="八白土星&#10;【変化・蓄積】山のように、物事の停止と再出発（変化）を表す星。転職や引越し、方針転換など、状況を改善するための変化を起こすのに良い日です。">八白土星</tspan></text>
			<text font-size="2.4" transform="translate(18,45)"><tspan x="0 0 0 0 0 0 0 0" dy="0 2.5 2.5 2.5 2.5 2.5 2.5 2.5">つちのと・うし</tspan></text>
			<text font-size="2.2" transform="translate(8,80)">十二直</text>
			<text font-size="2.2" transform="translate(18,80)">二十八宿</text>
			<text font-size="2.2" transform="translate(28,80)">二十七宿</text>
			<text font-size="5" font-weight="700" transform="translate(8,86)" data-tip="十二直 満（みつ）&#10;全てが満たされる日&#10;新規事・移転・結婚などは吉。動土・服薬は凶">満</text>
			<text font-size="5" font-weight="700" transform="translate(18,86)" data-tip="二十八宿 軫（しん）&#10;からす座γ(みつかけ星)の宿に入る。&#10;地鎮祭・落成式・祭祀・祝い事に吉。衣類仕立てに凶">軫</text>
			<text font-size="5" font-weight="700" transform="translate(28,86)" data-tip="二十七宿 箕（き）&#10;いて座γ(み星)の宿に入る。&#10;動土・池掘り・仕入れ・集金・改築に吉。結婚・葬式に凶">箕</text>
			<text font-size="2.2" transform="translate(8,90)">みつ</text>
			<text font-size="2.2" transform="translate(18,90)">しん</text>
			<text font-size="2.2" transform="translate(28,90)">き</text>
			<text font-size="3" transform="translate(82,78)">
				<tspan data-tip="立冬&#10;冬の気立ち初めていよいよ冷ゆれば也&#10;この日から立春の前日までが冬。日は短くなり時雨が降る季節。北国や高山からは初雪の知らせも届き、関東では空っ風が吹く頃です。">立冬</tspan>5日目
				<tspan data-tip="七十二候 山茶始開（つばきはじめてひらく）&#10;サザンカの花が咲き始める">[ 山茶始開 ]</tspan></text>
			<text font-size="3" transform="translate(82,83)"><tspan data-tip="小雪&#10;冷ゆるが故に雨も雪となりてくだるがゆへ也&#10;陽射しは弱まり、冷え込みが厳しくなる季節。木々の葉は落ち、平地にも初雪が舞い始める頃です。">小雪</tspan>まであと11日</text>
			<text font-size="3" transform="translate(82,88)">(太陽黄経 228.73°・正午)</text>
			<text font-size="3.2" font-weight="700" transform="translate(50,95)">
				<tspan data-tip="帰忌日&#10;天棓星の精・帰忌が地上に降りて来て、人家の門の前で家人が帰って来るのを妨害するとされる日。遠出・帰家・移徙(わたまし:貴人の転居)・呼女・娶婦は避ける。金の貸し借りも凶。">帰忌日</tspan> <tspan data-tip="凶会日&#10;陰陽二気の調和がうまく行かず、万事に忌むべき。この日に吉事を行うことは凶とされる。">凶会日</tspan>
			</text>        </g>
